<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Trang web bán hàng</h1>
    <ul>
        <li> <a href="http://trangchu.com">Trang chủ</a></li>
        <li><a href="http://sanpham.com">Sản phẩm</a></li>
        <li><a href="http://gioithieu.com">Giới thiệu</a></li>
        <li><a href="http://lienhe.com">Liên hệ</a></li>
    </ul>
    <h2>Thông tin sản phẩm</h2>
    <table border="1">
        <thead>
            <th>Tên sản phẩm</th>
            <th>Mô tả</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </thead>
        <tbody>
            <tr>
                <td>Sản phẩm 1</td>
                <td>Mô tả sản phẩm 1</td>
                <td>100.000đ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Sản phẩm 2</td>
                <td>Mô tả sản phẩm 2</td>
                <td>200.000đ</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Sản phẩm 3</td>
                <td>Mô tả sản phẩm 3</td>
                <td>300.000đ</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>
    <h2>Thông tin người dùng</h2>
    <form action="">
        <label for="full name">Họ và tên:</label>
        <input id="full name" type="text" name="full name"> <br />
        <label for="email">Email:</label>
        <input id="email" type="email" name="email"> <br />
        <label for="Phone">Số điện thoại:</label>
        <input id="Phone" type="tel" name="Phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"> <br />
        <label for="address">Địa chỉ:</label>
        <input id="address" type="text" name="address"> <br />
        <button>Đặt hàng</button> <br />
        <footer>
            &copy;Trang web bán hàng
        </footer>
    </form>
</body>
</html>
